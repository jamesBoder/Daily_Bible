name: ci-frontend

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for frontend changes
        id: filter
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(frontend/|\.github/workflows/ci-frontend\.yml)'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  check:
    name: Type Check, Lint, Test, Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: "true"

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: https://api.wordsofpraise.app
          GENERATE_SOURCEMAP: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          CI: "false"

      - name: Check bundle size
        working-directory: frontend
        run: npx size-limit --json | tee size-output.json && npx size-limit

      - name: Bundle size summary
        if: always()
        working-directory: frontend
        run: |
          if [ -f size-output.json ]; then
            SIZE=$(node -e "const d=require('./size-output.json'); console.log(d[0]?.sizeKB ? d[0].sizeKB.toFixed(1)+' KB' : d[0]?.size || 'unknown')" 2>/dev/null || echo "see logs")
            echo "## Bundle Size" >> $GITHUB_STEP_SUMMARY
            echo "| Chunk | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| JS total | $SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Limit | 1 MB |" >> $GITHUB_STEP_SUMMARY
          fi
