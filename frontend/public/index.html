    <meta name="apple-mobile-web-app-title" content="Words of Praise" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Apple Meta Tags -->

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Words of Praise - Inspiration Every Day" />
    <meta property="og:description" content="Daily Bible verses for inspiration" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Words of Praise" />
    <meta property="og:image" content="%PUBLIC_URL%/logo192.png" />
    <!-- Close Graph Tags -->

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Words of Praise - Inspiration Every Day" />
    <meta name="twitter:description" content="Daily Bible verses for inspiration" />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo192.png" />
    <!-- Twitter Card Tags -->

    <!-- Security Meta Tags -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 https://wordsofpraise-backend.fly.dev https://accounts.google.com https://rest.api.bible/v1 https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://apis.google.com https://accounts.google.com;" />

    
    <!-- Google Fonts - Optimized with async loading and font-display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical fonts for faster rendering -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/merriweather/v30/u-440qyriQwlOrhSvowK_l5-fCZM.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Async load Google Fonts CSS to eliminate render-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Merriweather:wght@400&family=Playfair+Display:wght@600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Merriweather:wght@400&family=Playfair+Display:wght@600;700&display=swap"></noscript>

    <!-- DNS prefetch removed for production - uncomment only for local development if needed -->
    <!-- <link rel="dns-prefetch" href="//localhost:8080"> -->
    
    <title>Words of Praise - Inspiration Every Day</title>
    
    <!-- Preload main CSS for faster loading -->
    <link rel="preload" href="%PUBLIC_URL%/static/css/main.*.css" as="style">
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Critical CSS - Extracted from main.css for faster initial render */
      *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
      html{-webkit-text-size-adjust:100%;font-family:Inter,system-ui,sans-serif;line-height:1.5}
      body{margin:0;line-height:inherit;color:#111827;font-size:16px;min-height:100vh;
        background:linear-gradient(180deg,#f8fafc 0,#e2e8f0 50%,#cbd5e1);
        background-attachment:fixed;
        padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
      .dark body{background:linear-gradient(180deg,#1a1a1a 0,#0f172a 50%,#1e293b)}
      #root{min-height:100vh}
      .text-gray-600{color:#4b5563!important}
      .dark .text-gray-600{color:#9ca3af!important}
      .text-gray-500{color:#374151!important}
      .dark .text-gray-500{color:#d1d5db!important}
      .text-gray-400{color:#374151!important}
      .dark .text-gray-400{color:#d1d5db!important}
      /* Font fallback to prevent layout shift */
      .font-serif{font-family:Merriweather,Georgia,serif}
      .font-display{font-family:Playfair Display,Georgia,serif}
      /* Basic layout utilities for initial render */
      .container{width:100%;max-width:1280px;margin:0 auto}
      .flex{display:flex}.hidden{display:none}.block{display:block}
      .items-center{align-items:center}.justify-between{justify-content:space-between}
      .p-4{padding:1rem}.px-4{padding-left:1rem;padding-right:1rem}
      .text-center{text-align:center}
      /* Card styles for main content */
      .card{background-color:#fff;border-radius:.5rem;padding:1.5rem;
        box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a}
      .dark .card{background-color:#1f2937;
        box-shadow:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a}
      /* Loading state */
      .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
      @keyframes pulse{50%{opacity:.5}}
    </style>
    
    <!-- Inline script for async CSS loading support -->
    <script>
      /*! loadCSS rel=preload polyfill. [c]2017 Filament Group, Inc. MIT License */
      !function(t){"use strict";t.loadCSS||(t.loadCSS=function(){});var e=loadCSS.relpreload={};if(e.support=function(){var e;try{e=t.document.createElement("link").relList.supports("preload")}catch(t){e=!1}return function(){return e}}(),e.bindMediaToggle=function(t){var e=t.media||"all";function a(){t.addEventListener?t.removeEventListener("load",a):t.attachEvent&&t.detachEvent("onload",a),t.setAttribute("onload",null),t.media=e}t.addEventListener?t.addEventListener("load",a):t.attachEvent&&t.attachEvent("onload",a),setTimeout(function(){t.rel="stylesheet",t.media="only x"}),setTimeout(function(){t.onload&&t.onload()},0)},!e.support()){var a=t.document.getElementsByTagName("link");for(var n=0;n<a.length;n++){var o=a[n];"preload"!==o.rel||"style"!==o.getAttribute("as")||o.getAttribute("data-loadcss")||(o.setAttribute("data-loadcss",!0),e.bindMediaToggle(o))}}}("undefined"!=typeof global?global:this);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Load non-critical CSS asynchronously after page loads -->
    <script>
      // Defer loading of main CSS to prevent render-blocking
      window.addEventListener('load', function() {
        // React build will inject the main CSS automatically
        // This ensures fonts and critical styles are already loaded
      });
    </script>
  </body>
</html>
